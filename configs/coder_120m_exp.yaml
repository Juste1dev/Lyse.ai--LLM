# Config expérimentale ~119M params (d_model 640 x 20 couches, contexte 1024).
# Ça change l'archi ET la fenêtre : aucune compatibilité avec les checkpoints
# 67M, entraînement from scratch obligatoire avec le tokenizer code.
# À déclarer comme tel dans la PR — CONTRIBUTING.md, section "Experimental changes".
model:
  name: lyse-coder-120m-exp
  vocab_size: 32000
  max_seq_len: 1024
  n_layers: 20
  n_heads: 10
  d_model: 640
  d_ff: 2560
  dropout: 0.1
  bias: false
  tie_embeddings: true
  use_gradient_checkpointing: true
  layer_norm_epsilon: 1.0e-5

data:
  seq_len: 1024
  train_shards_glob: data/packed_code/train-*.npy
  val_shards_glob: data/packed_code/val-*.npy
  shuffle_shards: true
  text_key: text
  num_workers: 0
  pin_memory: true

training:
  seed: 42
  device: cuda
  precision: bf16
  compile_model: false
  use_8bit_optimizer: true
  batch_size: 16
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0003
  min_lr: 0.00003
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 500
  max_steps: 50000
  grad_clip: 1.0
  log_interval: 10
  eval_interval: 250
  eval_batches: 20
  checkpoint_interval_steps: 250
  checkpoint_interval_minutes: 15
  checkpoint_dir: checkpoints/pretrain_coder_120m
  logs_dir: logs/pretrain_coder_120m
  tokenizer_path: artifacts/tokenizer_code.model
  resume_from: ""

sft:
  train_file: data/sft_code/train.jsonl
  val_file: data/sft_code/val.jsonl
  max_seq_len: 1024
  batch_size: 4
  micro_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0001
  min_lr: 0.00001
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  warmup_steps: 100
  max_steps: 5000
  grad_clip: 1.0
  precision: bf16
  compile_model: false
  log_interval: 10
  eval_interval: 100
  eval_batches: 20
  checkpoint_interval_steps: 100
  checkpoint_interval_minutes: 10
  checkpoint_dir: checkpoints/sft_coder_120m
  logs_dir: logs/sft_coder_120m
